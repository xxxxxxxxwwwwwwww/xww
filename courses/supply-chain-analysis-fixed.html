<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供应链分析 - Xww的课程页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.3/src-noconflict/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.3/src-noconflict/mode-python.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.3/src-noconflict/theme-tomorrow_night.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#06b6d4',
                        secondary: '#1e293b',
                        accent: '#10b981',
                        code: '#1e293b',
                        codeText: '#e2e8f0',
                        dark: '#111827',
                        'dark-gray': '#1f2937',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                },
            }
        }
    </script>
    <style>
        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4); }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-secondary:hover { background: #475569; }
        
        .problem-item {
            padding: 12px;
            background: #1e293b;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            border: 2px solid transparent;
        }
        .problem-item:hover { background: #334155; }
        .problem-item.active { background: #0ea5e9; border-color: #38bdf8; }
        
        .difficulty-tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .difficulty-easy { background: #10b981; color: white; }
        .difficulty-medium { background: #f59e0b; color: white; }
        .difficulty-hard { background: #ef4444; color: white; }
        
        .code-editor { height: 300px; border-radius: 8px; }
        .code-output {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            min-height: 150px;
        }
        
        .nav-link { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
        .nav-link:hover { color: #e2e8f0; background: #1e293b; }
        .nav-link.active { color: #06b6d4; background: rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="bg-dark text-gray-200 min-h-screen">
    <nav class="fixed top-0 left-0 right-0 bg-dark-gray border-b border-gray-700 z-50">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl font-bold text-cyan-400">
                    <i class="fa fa-truck mr-2"></i>供应链分析题库
                </h1>
                <div class="flex items-center gap-4">
                    <a href="#" class="nav-link active" id="nav-bank">
                        <i class="fa fa-book"></i> 题库
                    </a>
                    <a href="#" class="nav-link" id="nav-knowledge">
                        <i class="fa fa-graduation-cap"></i> 知识点
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-24 container mx-auto px-4">
        <div class="flex gap-6">
            <div class="w-1/4 bg-dark-gray rounded-xl p-4 h-[calc(100vh-8rem)] overflow-y-auto">
                <h2 class="text-lg font-bold mb-4">📚 供应链分析题库</h2>
                
                <div onclick="loadProblem(1)" class="problem-item active">
                    <div class="font-medium">问题1：需求预测</div>
                    <span class="difficulty-tag difficulty-easy">简单</span>
                </div>
                
                <div onclick="loadProblem(2)" class="problem-item">
                    <div class="font-medium">问题2：库存管理</div>
                    <span class="difficulty-tag difficulty-medium">中等</span>
                </div>
                
                <div onclick="loadProblem(3)" class="problem-item">
                    <div class="font-medium">问题3：运输优化</div>
                    <span class="difficulty-tag difficulty-medium">中等</span>
                </div>
                
                <div onclick="loadProblem(4)" class="problem-item">
                    <div class="font-medium">问题4：供应商选择</div>
                    <span class="difficulty-tag difficulty-hard">困难</span>
                </div>
            </div>
            
            <div class="w-3/4 space-y-6">
                <div class="bg-dark-gray rounded-xl p-6">
                    <h3 class="text-xl font-bold mb-4" id="problem-title">问题1：需求预测</h3>
                    <div id="problem-desc">使用Python进行需求预测分析。</div>
                </div>
                
                <div class="bg-dark-gray rounded-xl p-6">
                    <div class="flex justify-between mb-4">
                        <h3 class="text-lg">代码编辑器</h3>
                        <button class="btn-primary" onclick="runCode()">
                            <i class="fa fa-play"></i> 运行
                        </button>
                    </div>
                    <div id="codeEditor" class="code-editor"></div>
                    <div id="pyodide-status" class="mt-2 text-sm text-yellow-400">
                        <i class="fa fa-spinner fa-spin"></i> 加载中...
                    </div>
                </div>
                
                <div class="bg-dark-gray rounded-xl p-6">
                    <h3 class="text-lg mb-4">运行结果</h3>
                    <div id="code-output" class="code-output">运行代码查看结果</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 问题数据
        const problems = [
            {
                id: 1,
                title: "问题1：需求预测",
                desc: "使用Python进行需求预测分析。<br><strong>要求：</strong><ul><li>计算移动平均</li><li>预测下期需求</li></ul>",
                code: "# 需求预测\nimport pandas as pd\n\ndata = [100, 120, 90, 150, 130]\nprint('数据:', data)\nprint('平均值:', sum(data) / len(data))"
            },
            {
                id: 2,
                title: "问题2：库存管理",
                desc: "计算经济订货量(EOQ)。<br><strong>要求：</strong><ul><li>计算EOQ</li><li>计算总成本</li></ul>",
                code: "# 库存管理\nimport math\n\nD = 10000  # 年需求\nS = 50     # 订货成本\nH = 10     # 单位持有成本\n\neoq = math.sqrt(2 * D * S / H)\nprint('经济订货量:', round(eoq, 2))"
            },
            {
                id: 3,
                title: "问题3：运输优化",
                desc: "优化运输路线。<br><strong>要求：</strong><ul><li>计算最短路径</li><li>优化成本</li></ul>",
                code: "# 运输优化\ndistances = [10, 20, 15, 25]\ntotal = sum(distances)\nprint('总距离:', total)\nprint('平均距离:', total / len(distances))"
            },
            {
                id: 4,
                title: "问题4：供应商选择",
                desc: "使用AHP方法选择供应商。<br><strong>要求：</strong><ul><li>计算权重</li><li>评分选择</li></ul>",
                code: "# 供应商选择\nsuppliers = {'A': 85, 'B': 92, 'C': 78}\nbest = max(suppliers, key=suppliers.get)\nprint('最佳供应商:', best)\nprint('得分:', suppliers[best])"
            }
        ];

        let editor = null;
        let pyodide = null;

        function loadProblem(id) {
            console.log('loadProblem called:', id);
            const problem = problems.find(p => p.id === id);
            if (!problem) {
                console.error('Problem not found:', id);
                return;
            }
            
            document.getElementById('problem-title').textContent = problem.title;
            document.getElementById('problem-desc').innerHTML = problem.desc;
            
            if (editor) {
                editor.setValue(problem.code);
                editor.clearSelection();
            }
            
            // 更新高亮
            document.querySelectorAll('.problem-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.problem-item')[id - 1].classList.add('active');
        }

        async function runCode() {
            if (!pyodide) {
                document.getElementById('code-output').textContent = 'Python未加载';
                return;
            }
            
            const code = editor.getValue();
            document.getElementById('code-output').textContent = '运行中...';
            
            try {
                const result = await pyodide.runPythonAsync(code);
                document.getElementById('code-output').textContent = result || '执行完成';
            } catch (error) {
                document.getElementById('code-output').textContent = '错误: ' + error.message;
            }
        }

        async function initPyodide() {
            try {
                pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/" });
                document.getElementById('pyodide-status').innerHTML = '<i class="fa fa-check text-green-400"></i> Python就绪';
            } catch (error) {
                document.getElementById('pyodide-status').innerHTML = '<i class="fa fa-times text-red-400"></i> 加载失败';
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing...');
            
            editor = ace.edit('codeEditor');
            editor.setTheme('ace/theme/tomorrow_night');
            editor.getSession().setMode('ace/mode/python');
            editor.setValue(problems[0].code);
            
            loadProblem(1);
            initPyodide();
        });

        // 导航切换
        document.getElementById('nav-bank').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('nav-bank').classList.add('active');
            document.getElementById('nav-knowledge').classList.remove('active');
        });
    </script>
</body>
</html>
