<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供应链数据分析 - 在线考试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-btn.selected { border-color: #06b6d4; background-color: rgba(6, 182, 212, 0.2); }
        .option-btn.correct { border-color: #10b981; background-color: rgba(16, 185, 129, 0.2); }
        .option-btn.wrong { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.2); }
        .question-nav-btn.current { background-color: #06b6d4; color: white; }
        .question-nav-btn.answered { background-color: #10b981; color: white; }
        .question-nav-btn.marked { background-color: #f59e0b; color: white; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-xl font-bold text-cyan-400">供应链数据分析</h1>
                <p class="text-sm text-gray-400 mt-1">在线考试系统</p>
            </div>
            <div class="p-4 border-b border-gray-700">
                <div class="text-sm text-gray-400 mb-2">考试时间</div>
                <div id="timerDisplay" class="text-2xl font-mono text-cyan-400">30:00</div>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <div class="text-sm text-gray-400 mb-3">题目导航</div>
                <div id="questionNav" class="grid grid-cols-5 gap-2"></div>
                <div class="mt-4 text-xs text-gray-500">
                    <div class="flex items-center mb-1">
                        <span class="w-4 h-4 rounded bg-gray-700 mr-2"></span>
                        <span>未作答</span>
                    </div>
                    <div class="flex items-center mb-1">
                        <span class="w-4 h-4 rounded bg-cyan-500 mr-2"></span>
                        <span>当前题目</span>
                    </div>
                    <div class="flex items-center mb-1">
                        <span class="w-4 h-4 rounded bg-green-500 mr-2"></span>
                        <span>已作答</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-4 h-4 rounded bg-yellow-500 mr-2"></span>
                        <span>已标记</span>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-700">
                <button onclick="submitExam()" id="submitBtn" class="w-full bg-cyan-600 hover:bg-cyan-700 py-2 rounded-lg font-medium transition">
                    提交试卷
                </button>
                <a href="supply-chain-analysis.html" class="block w-full bg-gray-700 hover:bg-gray-600 text-center py-2 rounded-lg font-medium transition mt-2">
                    返回学习
                </a>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-gray-800 border-b border-gray-700 px-6 py-3">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-sm text-gray-400">题目 </span>
                        <span id="currentQuestionNum" class="text-cyan-400 font-medium">1</span>
                        <span class="text-sm text-gray-400"> / </span>
                        <span id="totalQuestions" class="text-gray-300">5</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="markQuestion()" id="markBtn" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                            标记此题
                        </button>
                        <button onclick="prevQuestion()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                            上一题
                        </button>
                        <button onclick="nextQuestion()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                            下一题
                        </button>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-6">
                <div id="questionContent" class="max-w-3xl mx-auto"></div>
            </div>

            <div id="resultPanel" class="hidden fixed inset-0 bg-gray-900 bg-opacity-95 flex items-center justify-center z-50">
                <div class="bg-gray-800 rounded-lg p-8 max-w-md w-full mx-4 text-center">
                    <h2 class="text-2xl font-bold text-cyan-400 mb-4">考试结果</h2>
                    <div id="scoreDisplay" class="text-6xl font-bold text-green-400 mb-4">0</div>
                    <div class="text-gray-400 mb-6">总分 100 分</div>
                    <div id="resultDetails" class="text-left bg-gray-700 rounded-lg p-4 mb-6"></div>
                    <div class="flex space-x-4">
                        <button onclick="reviewExam()" class="flex-1 bg-cyan-600 hover:bg-cyan-700 py-2 rounded-lg font-medium transition">
                            查看解析
                        </button>
                        <a href="supply-chain-analysis.html" class="flex-1 bg-gray-700 hover:bg-gray-600 text-center py-2 rounded-lg font-medium transition">
                            返回学习
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const examQuestions = [
            {
                id: 1,
                question: "供应链的三大核心要素是什么？",
                options: [
                    { label: 'A', text: '采购、生产、销售' },
                    { label: 'B', text: '信息流、物流、资金流' },
                    { label: 'C', text: '供应商、制造商、客户' },
                    { label: 'D', text: '计划、执行、控制' }
                ],
                answer: 'B',
                explanation: '供应链的三大核心要素是信息流、物流和资金流。信息流包括订单信息、需求预测等；物流包括原材料、在制品、成品的流动；资金流包括货款支付、信用交易等。',
                score: 20
            },
            {
                id: 2,
                question: "在指数平滑法中，当平滑系数α接近1时，预测结果会？",
                options: [
                    { label: 'A', text: '更加平滑，响应变慢' },
                    { label: 'B', text: '更加平滑，响应变快' },
                    { label: 'C', text: '更加敏感，响应变快' },
                    { label: 'D', text: '更加敏感，响应变慢' }
                ],
                answer: 'C',
                explanation: '当α接近1时，预测更加重视近期数据，对变化更加敏感，响应速度变快。当α接近0时，预测更加平滑，重视历史趋势，响应变慢。',
                score: 20
            },
            {
                id: 3,
                question: "根据EOQ模型，当年需求量增加一倍时，经济订货量会？",
                options: [
                    { label: 'A', text: '增加一倍' },
                    { label: 'B', text: '增加√2倍（约1.414倍）' },
                    { label: 'C', text: '增加两倍' },
                    { label: 'D', text: '保持不变' }
                ],
                answer: 'B',
                explanation: '根据EOQ公式：EOQ = √(2DS/H)，当年需求量D增加一倍时，EOQ变为√(2×2D×S/H) = √2 × √(2DS/H)，即增加√2倍（约1.414倍）。这是平方根关系。',
                score: 20
            },
            {
                id: 4,
                question: "VRPTW是指带什么约束的车辆路径问题？",
                options: [
                    { label: 'A', text: '容量约束' },
                    { label: 'B', text: '时间窗约束' },
                    { label: 'C', text: '取送货约束' },
                    { label: 'D', text: '多车场约束' }
                ],
                answer: 'B',
                explanation: 'VRPTW (Vehicle Routing Problem with Time Windows) 是带时间窗约束的车辆路径问题，要求车辆在客户指定的时间范围内到达。CVRP是带容量约束的VRP，VRPPD是带取送货的VRP。',
                score: 20
            },
            {
                id: 5,
                question: "以下哪项不属于供应链韧性的维度？",
                options: [
                    { label: 'A', text: '敏捷性' },
                    { label: 'B', text: '冗余性' },
                    { label: 'C', text: '经济性' },
                    { label: 'D', text: '可视性' }
                ],
                answer: 'C',
                explanation: '供应链韧性的四个维度是：敏捷性（快速响应能力）、冗余性（备用资源储备）、柔性（适应变化能力）、可视性（信息透明程度）。经济性不是韧性维度。',
                score: 20
            }
        ];

        let currentQuestion = 0;
        let answers = {};
        let markedQuestions = new Set();
        let examSubmitted = false;
        let timeRemaining = 30 * 60;
        let timerInterval = null;

        function init() {
            document.getElementById('totalQuestions').textContent = examQuestions.length;
            renderQuestionNav();
            renderQuestion();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining > 0 && !examSubmitted) {
                    timeRemaining--;
                    const minutes = Math.floor(timeRemaining / 60);
                    const seconds = timeRemaining % 60;
                    document.getElementById('timerDisplay').textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    
                    if (timeRemaining <= 300) {
                        document.getElementById('timerDisplay').classList.add('text-red-400');
                        document.getElementById('timerDisplay').classList.remove('text-cyan-400');
                    }
                } else if (timeRemaining <= 0 && !examSubmitted) {
                    submitExam();
                }
            }, 1000);
        }

        function renderQuestionNav() {
            const nav = document.getElementById('questionNav');
            nav.innerHTML = examQuestions.map((q, i) => {
                let btnClass = 'question-nav-btn w-8 h-8 rounded text-sm font-medium bg-gray-700 hover:bg-gray-600 transition cursor-pointer';
                if (i === currentQuestion) btnClass += ' current';
                else if (markedQuestions.has(i)) btnClass += ' marked';
                else if (answers[i] !== undefined) btnClass += ' answered';
                
                return `<button onclick="goToQuestion(${i})" class="${btnClass}">${i + 1}</button>`;
            }).join('');
        }

        function renderQuestion() {
            const q = examQuestions[currentQuestion];
            const selectedAnswer = answers[currentQuestion];
            
            document.getElementById('currentQuestionNum').textContent = currentQuestion + 1;
            document.getElementById('markBtn').textContent = markedQuestions.has(currentQuestion) ? '取消标记' : '标记此题';
            
            let html = `
                <div class="bg-gray-800 rounded-lg p-6 mb-6">
                    <div class="flex items-start mb-4">
                        <span class="text-cyan-400 font-medium mr-3">${currentQuestion + 1}.</span>
                        <p class="text-lg">${q.question}</p>
                    </div>
                    <div class="space-y-3 ml-6">
            `;
            
            q.options.forEach(opt => {
                let optClass = 'option-btn w-full text-left px-4 py-3 rounded-lg border border-gray-600 hover:border-cyan-500 transition flex items-center cursor-pointer';
                if (selectedAnswer === opt.label) optClass += ' selected';
                
                html += `
                    <div onclick="selectAnswer('${opt.label}')" class="${optClass}">
                        <span class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center mr-3 font-medium flex-shrink-0">${opt.label}</span>
                        <span>${opt.text}</span>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            if (examSubmitted) {
                html += `
                    <div class="bg-gray-800 rounded-lg p-6">
                        <h4 class="font-medium text-cyan-400 mb-2">答案解析</h4>
                        <p class="text-gray-300 mb-2">正确答案：<span class="text-green-400 font-medium">${q.answer}</span></p>
                        <p class="text-gray-300">${q.explanation}</p>
                    </div>
                `;
            }
            
            document.getElementById('questionContent').innerHTML = html;
        }

        function selectAnswer(label) {
            if (examSubmitted) return;
            answers[currentQuestion] = label;
            renderQuestionNav();
            renderQuestion();
        }

        function goToQuestion(index) {
            currentQuestion = index;
            renderQuestionNav();
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestionNav();
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestion < examQuestions.length - 1) {
                currentQuestion++;
                renderQuestionNav();
                renderQuestion();
            }
        }

        function markQuestion() {
            if (markedQuestions.has(currentQuestion)) {
                markedQuestions.delete(currentQuestion);
            } else {
                markedQuestions.add(currentQuestion);
            }
            renderQuestionNav();
            document.getElementById('markBtn').textContent = markedQuestions.has(currentQuestion) ? '取消标记' : '标记此题';
        }

        function submitExam() {
            const unanswered = examQuestions.length - Object.keys(answers).length;
            if (unanswered > 0 && timeRemaining > 0) {
                if (!confirm(`您还有 ${unanswered} 道题未作答，确定要提交吗？`)) {
                    return;
                }
            }
            
            examSubmitted = true;
            clearInterval(timerInterval);
            
            let totalScore = 0;
            let correctCount = 0;
            
            examQuestions.forEach((q, i) => {
                if (answers[i] === q.answer) {
                    totalScore += q.score;
                    correctCount++;
                }
            });
            
            document.getElementById('scoreDisplay').textContent = totalScore;
            if (totalScore >= 60) {
                document.getElementById('scoreDisplay').classList.remove('text-red-400');
                document.getElementById('scoreDisplay').classList.add('text-green-400');
            } else {
                document.getElementById('scoreDisplay').classList.remove('text-green-400');
                document.getElementById('scoreDisplay').classList.add('text-red-400');
            }
            
            document.getElementById('resultDetails').innerHTML = `
                <div class="flex justify-between mb-2">
                    <span class="text-gray-400">正确题数</span>
                    <span class="text-green-400">${correctCount} / ${examQuestions.length}</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-400">错误题数</span>
                    <span class="text-red-400">${examQuestions.length - correctCount}</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">用时</span>
                    <span class="text-cyan-400">${formatTime(30 * 60 - timeRemaining)}</span>
                </div>
            `;
            
            document.getElementById('resultPanel').classList.remove('hidden');
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}分${secs}秒`;
        }

        function reviewExam() {
            document.getElementById('resultPanel').classList.add('hidden');
            currentQuestion = 0;
            renderQuestionNav();
            renderQuestion();
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                const q = examQuestions[currentQuestion];
                const optLabel = btn.querySelector('span:first-child').textContent;
                if (optLabel === q.answer) {
                    btn.classList.add('correct');
                } else if (answers[currentQuestion] === optLabel && optLabel !== q.answer) {
                    btn.classList.add('wrong');
                }
            });
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
